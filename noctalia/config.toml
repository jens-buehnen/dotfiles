[audio]
enable_sounds = true
sound_volume = 1
volume_change_sound = "/usr/share/sounds/freedesktop/stereo/audio-volume-change.oga"

[bar.default]
capsule_radius = 0
margin_ends = 0
radius = 0
shadow = false
start = ["wallpaper", "workspaces"]
thickness = 30

[battery]
warning_threshold = 15

[dock]
radius = 0
shadow = false

[lockscreen]
transition = []

[shell]
animation.enabled = false
avatar_path = "~/.face"
corner_radius_scale = 0.0
font_family = "JetBrainsMono NFM"
panel.shadow = false
polkit_agent = true

[theme]
community_palette = "Catppuccin Mocha Pink"
source = "community"
